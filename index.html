<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/refs/heads/main/image.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadei!</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="dark">


    <!-- Welcome Login Modal -->

    <div class="welcome-overlay" id="welcome">

        <div class="welcome-box">


            <div class="welcome-icon">

                <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/image.png?raw=true"
                    alt="Cadencea Logo" height="100" width="100">

            </div>



            <h2>
                Welcome to Cadei AI
            </h2>



            <p>
                Sign in with your Google Account to continue
            </p>



            <button id="googleLogin">

                Continue with Google

                <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/GOOGLE%20TRANSPARENT%20ICON.webp?raw=true"
                    width="20" height="20">

            </button>


        </div>

    </div>



    <div class="background"></div>



    <div class="app">
        <!-- Header -->

        <header>


            <div class="profile">

                <img id="userPhoto" src="" alt="Profile">

            </div>



            <div class="brand">

                <h1 id="greeting">
                    Hello!
                </h1>


                <p>
                    Powered by Cadence AI
                </p>


            </div>



            <button id="themeToggle">

                ☀️

            </button>


        </header>





        <!-- Chat Area -->

        <main id="chat">


            <!-- Messages will appear here -->


        </main>
        <!-- Input Area -->

        <footer>


            <div class="attachment-wrapper">

                <button id="attach">

                    <img src="https://raw.githubusercontent.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/eb2bc4779b424f0c5347ad733df82ce5a93795cf/icons/plus%20.svg"
                        class="footer-icon" height="40" width="40">

                </button>

                <div id="attachMenu" class="attach-menu">

                    <button type="button" id="pickImage">

                        <img src="icons/photos.svg" class="menu-icon" height="40" width="40">



                    </button>

                    <button type="button" id="pickCamera">
                        <img src="icons/camera.svg" class="menu-icon" height="40" width="40">



                    </button>

                    <button type="button" id="pickDocument">

                        <img src="icons/documents.svg" class="menu-icon" height="40" width="40">



                    </button>

                </div>

            </div>

            <input type="file" id="imageUpload" accept="image/*" hidden>

            <input type="file" id="cameraUpload" accept="image/*" capture="environment" hidden>

            <input type="file" id="documentUpload" accept=".pdf,.doc,.docx,.txt" hidden>

            <div id="imagePreview"></div>



            <textarea id="prompt" placeholder="Message Cadence AI..." rows="1">
            </textarea>



            <button id="voice">

                <img src="icons/sound.png" class="footer-icon" alt="Voice" height="40" width="40">

            </button>



            <button id="send">

                <img src="icons/send.svg" class="footer-icon" alt="Send" height="40" width="40">

            </button>


        </footer>


    </div>




    <!-- Math + Markdown -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">


    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>


    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js">
    </script>


    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <script type="module" src="script.js">
    </script>


</body>

</html>
