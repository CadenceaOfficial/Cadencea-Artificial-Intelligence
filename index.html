<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/refs/heads/main/image.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadei!</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="dark">


    <!-- User Welcome Modal -->

    <div class="welcome-overlay" id="welcome">

        <div class="welcome-box">


            <div class="welcome-icon">
                <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/image.png?raw=true" alt="Cadencea Logo" height="100" width="100">
            </div>


            <h2>
                Welcome to Cadei AI
            </h2>


            <p>
                Please Signup with your Google Account
            </p>


            <button id="googleLogin">
                Continue with Google <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/GOOGLE%20TRANSPARENT%20ICON.webp?raw=true" heigth="20" width="20">
            </button>


        </div>

    </div>



    <div class="background"></div>



    <div class="app">



        <header>


            <div class="profile">

                <img id="userPhoto" src="">

            </div>



            <div class="brand">


                <h1>
                    Cadei Artificial Intelligence
                </h1>


                <p>
                    Cadencea
                </p>


            </div>




            <button id="themeToggle">

                ☀️

            </button>



        </header>





        <main id="chat">


            <!-- Messages appear here -->


        </main>






        <footer>

            <button id="attach">📎</button>

            <input type="file" id="imageUpload" accept="image/*" hidden>

            <div id="imagePreview"></div>

            <textarea id="prompt" placeholder="Message Cadence AI..." rows="1"></textarea>

            <button id="voice">🎤</button>

            <button id="send">➜</button>

        </footer>





    </div>



    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="module" src="script.js"></script>



</body>

</html>
