<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadencea AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- User Welcome Modal -->

    <div class="welcome-overlay" id="welcome">

        <div class="welcome-box">


            <div class="welcome-icon">
                🤖
            </div>


            <h2>
                Welcome to Cadencea AI
            </h2>


            <p>
                Before we begin, what should I call you?
            </p>


            <button id="googleLogin">
                Continue with Google 🚀
            </button>


        </div>

    </div>



    <div class="background"></div>



    <div class="app">



        <header>


            <div class="profile">

                <img id="userPhoto" src="">

            </div>



            <div class="brand">


                <h1>
                    Cadencea AI
                </h1>


                <p>
                    AI Assistant
                </p>


            </div>




            <button id="themeToggle">

                🌙

            </button>



        </header>





        <main id="chat">


            <!-- Messages appear here -->


        </main>






        <footer>

            <button id="attach">📎</button>

            <textarea id="prompt" placeholder="Message Cadence AI..." rows="1"></textarea>

            <button id="voice">🎤</button>

            <button id="send">➜</button>

        </footer>





    </div>





    <script type="module" src="script.js"></script>



</body>

</html>
