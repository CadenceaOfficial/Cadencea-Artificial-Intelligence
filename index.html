<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/refs/heads/main/image.png">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadei!</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="dark">


    <!-- Welcome Login Modal -->

    <div class="welcome-overlay" id="welcome">

        <div class="welcome-box">


            <div class="welcome-icon">

                <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/image.png?raw=true"
                    alt="Cadencea Logo" height="100" width="100">

            </div>



            <h2>
                Welcome to Cadei
            </h2>



            <p>
                Sign in with your Google Account to continue
            </p>



            <button id="googleLogin">

                Continue with Google

                <img src="https://github.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/blob/main/GOOGLE%20TRANSPARENT%20ICON.webp?raw=true"
                    width="20" height="20">

            </button>


        </div>

    </div>



    <div class="background"></div>



    <div class="app">
        <!-- Header -->

        <header>


            <div class="profile">

                <img id="userPhoto" src="" alt="Profile">

            </div>



            <div class="brand">

                <h1 id="greeting">
                    Hello!
                </h1>


                <p>
                    Powered by Cadencea AI
                </p>


            </div>



            <button id="themeToggle">

                ☀️

            </button>


        </header>





        <!-- Chat Area -->

        <main id="chat"></main>
        <footer>

            <!-- Attachment -->
            <div class="attachment-wrapper">

                <button id="attach" type="button">

                    <img src="https://raw.githubusercontent.com/CadenceaOfficial/Cadencea-Artificial-Intelligence/ec8eccc96f4791f5fe4046657987756b3e952104/icons/plus%20.svg"
                        class="footer-icon" alt="Attach">

                </button>

                <div id="attachMenu" class="attach-menu">

                    <button id="pickImage" type="button">

                        <img src="icons/photos.svg" class="menu-icon" alt="Gallery">

                    </button>

                    <button id="pickCamera" type="button">

                        <img src="icons/camera.svg" class="menu-icon" alt="Camera">

                    </button>

                    <button id="pickDocument" type="button">

                        <img src="icons/documents.svg" class="menu-icon" alt="Document">

                    </button>

                </div>

            </div>


            <!-- Hidden Inputs -->

            <input type="file" id="imageUpload" accept="image/*" hidden>

            <input type="file" id="cameraUpload" accept="image/*" capture="environment" hidden>

            <input type="file" id="documentUpload" accept=".pdf,.doc,.docx,.txt" hidden>


            <!-- Image Preview -->

            <div id="imagePreview"></div>


            <!-- Message Box -->

            <textarea id="prompt" rows="1" placeholder="Message Cadence AI..."></textarea>


            <!-- Voice -->

            <button id="voice" type="button">

                <img src="icons/sound.png" class="footer-icon" alt="Voice">

            </button>


            <!-- Send -->

            <button id="send" type="button">

                <img src="icons/send.svg" class="footer-icon" alt="Send">

            </button>

        </footer>


    </div>




    <!-- Math + Markdown -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">


    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js">
    </script>


    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js">
    </script>


    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <script type="module" src="script.js">
    </script>


</body>

</html>
